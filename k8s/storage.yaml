apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-attachments-pvc
  namespace: notes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path  # Adjust based on your cluster's storage class
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-storage-config
  namespace: notes
data:
  MAX_USER_STORAGE_BYTES: "1073741824"  # 1 GiB per user
  MAX_FILE_SIZE_BYTES: "104857600"       # 100 MB max single file
  ATTACHMENTS_PATH: "/data/attachments"
