[package]
name = "notes-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-multipart = "0.6"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
thiserror = "1.0"
url = "2.5"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
reqwest = { version = "0.11", features = ["json"] }
oauth2 = "4.4"
rand = "0.8"
urlencoding = "2.1"
